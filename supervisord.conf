[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gateway]
command=hermes gateway run
environment=HERMES_HOME="/opt/data"
autorestart=true
startsecs=15
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:dashboard]
command=hermes dashboard --host 127.0.0.1 --port 9119 --no-open
environment=HERMES_HOME="/opt/data",GATEWAY_HEALTH_URL="http://127.0.0.1:8642"
autorestart=true
startsecs=15
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:sync]
# Push /opt/data to R2 every 5 minutes so a redeploy does not wipe memory/sessions/skills.
command=/bin/bash -c "while true; do sleep 300; /usr/local/bin/sync.sh up || true; done"
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
