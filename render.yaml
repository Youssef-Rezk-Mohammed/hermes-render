services:
  - type: web
    name: hermes-agent
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Built-in dashboard, supervised by the image's s6 init.
      - key: HERMES_DASHBOARD
        sync: false
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        sync: false
        value: "0.0.0.0"
      # cont-init sets HERMES_DASHBOARD_PORT from Render's runtime $PORT and
      # derives the built-in dashboard's auth variables from these values.
      - key: DASHBOARD_USER
        sync: false
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      # Cloudflare R2 (S3-compatible) for persistent /opt/data
      - key: R2_ENDPOINT
        sync: false   # e.g. https://<accountid>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
        value: hermes-data
      - key: R2_PREFIX
        sync: false
        value: data
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # LLM: OpenCode Zen (OpenAI-compatible)
      - key: OPENCODE_API_KEY
        sync: false   # your OpenCode Zen key
      - key: OPENCODE_BASE_URL
        sync: false
        value: https://opencode.ai/zen/v1
      - key: OPENCODE_MODEL
        sync: false
        value: deepseek-v4-flash
