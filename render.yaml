services:
  - type: web
    name: hermes-agent
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Public port (Render injects this; wrap.sh maps it to HERMES_DASHBOARD_PORT)
      - key: PORT
        sync: false
      # Built-in dashboard (supervised by the image's s6 init)
      - key: HERMES_DASHBOARD
        sync: false
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        sync: false
        value: "0.0.0.0"
      # Basic-auth gate (required on a public bind)
      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        sync: false
        value: admin
      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        sync: false
        value: "change-this-secret-to-a-random-string"
      # Cloudflare R2 (S3-compatible) for persistent /opt/data
      - key: R2_ENDPOINT
        sync: false   # e.g. https://<accountid>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
        value: hermes-data
      - key: R2_PREFIX
        sync: false
        value: data
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # LLM: OpenCode Zen (OpenAI-compatible)
      - key: OPENCODE_API_KEY
        sync: false   # your OpenCode Zen key
      - key: OPENCODE_BASE_URL
        sync: false
        value: https://opencode.ai/zen/v1
      - key: OPENCODE_MODEL
        sync: false
        value: deepseek-v4-flash
